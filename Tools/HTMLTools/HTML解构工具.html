<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 解构工具 · data-u-name 语义命名 v3.10.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5; --surface: #ffffff; --surface-alt: #f8f9fa;
            --border: #dde1e6; --text: #2c3e50; --text-secondary: #5a6c7d;
            --primary: #4f6ef7; --primary-hover: #3b54d4; --primary-light: #eef1fd;
            --success: #22c55e; --success-bg: #f0fdf6; --error: #ef4444; --error-bg: #fef2f2;
            --radius: 10px; --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.10),0 3px 10px rgba(0,0,0,0.05);
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font-mono: 'SF Mono','Cascadia Code','Consolas','Monaco','Menlo','Ubuntu Mono',monospace;
            --font-sans: 'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; -webkit-font-smoothing: antialiased;
        }
        .app-container {
            width: 100%; background: var(--surface); border-radius: 16px;
            box-shadow: var(--shadow-lg); overflow: hidden;
            display: flex; flex-direction: column; min-height: 85vh; max-height: 95vh;
        }
        .app-header {
            padding: 18px 28px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
            background: var(--surface); flex-shrink: 0; position: relative;
        }
        .app-header .logo-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, #4f6ef7, #7b5cff);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; font-weight: 700; flex-shrink: 0;
        }
        .app-header h1 { font-size: 1.25rem; font-weight: 700; }
        .app-header .subtitle { font-size: 0.82rem; color: var(--text-secondary); margin-left: 4px; }
        .version-tag {
            margin-left: auto; background: var(--primary-light); color: var(--primary);
            padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            white-space: nowrap; border: 1px solid rgba(79,110,247,0.2);
        }
        .main-content { display: flex; flex: 1; min-height: 0; }
        .panel-left {
            width: 44%; min-width: 380px; display: flex; flex-direction: column;
            border-right: 1px solid var(--border); background: var(--surface-alt); flex-shrink: 0;
        }
        .panel-section { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 20px 22px; gap: 10px; }
        .section-label {
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
            font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0;
        }
        .section-label .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot-input { background: #f59e0b; } .dot-output { background: #22c55e; } .dot-preview { background: #4f6ef7; }

        textarea {
            width: 100%; flex: 1; min-height: 140px; border: 1.5px solid var(--border);
            border-radius: var(--radius); padding: 14px 16px; font-family: var(--font-mono);
            font-size: 0.85rem; line-height: 1.55; resize: none; background: var(--surface);
            color: var(--text); transition: var(--transition); outline: none; tab-size: 2;
        }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,0.08); background: #fefefe; }
        textarea::placeholder { color: #b0b8c1; }
        textarea.input-area { min-height: 200px; flex: 2; }

        /* 完整输出只供复制/下载读取；display:none 避免大段文本进入页面布局。 */
        .hidden-textarea { display: none; }

        .url-loader { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
        .url-input, .proxy-input {
            padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-family: var(--font-mono); font-size: 0.85rem; background: var(--surface); color: var(--text);
            outline: none; transition: var(--transition);
        }
        .url-input { flex: 2; min-width: 200px; }
        .proxy-input { flex: 2; min-width: 200px; }
        .url-input:focus, .proxy-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,0.08); }
        .btn-load, .btn-file {
            padding: 8px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface); font-size: 0.85rem; font-weight: 500; cursor: pointer;
            white-space: nowrap; transition: var(--transition); color: var(--text-secondary);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-load:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-file:hover { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-file input[type="file"] { display: none; }

        .output-code-wrapper {
            flex: 1; min-height: 160px; border: 1.5px solid var(--border); border-radius: var(--radius);
            background: #fcfcfd; overflow: auto; box-shadow: var(--shadow-sm);
            font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.55; tab-size: 2;
        }
        .output-code-wrapper pre { margin: 0; padding: 14px 16px; white-space: pre; color: #3b3f4a; background: transparent; }
        .output-code-wrapper code { font-family: inherit; font-size: inherit; }

        .action-row { display: flex; align-items: center; gap: 14px; flex-shrink: 0; padding: 8px 0 4px 0; flex-wrap: wrap; }
        .btn-deconstruct {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 26px;
            background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm);
            font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: var(--transition);
            white-space: nowrap; letter-spacing: 0.01em; flex-shrink: 0;
        }
        .btn-deconstruct:hover { background: var(--primary-hover); box-shadow: 0 4px 14px rgba(79,110,247,0.3); transform: translateY(-1px); }
        .btn-deconstruct:disabled { background: #b0b8c1; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-deconstruct .btn-icon { font-size: 1.1rem; transition: transform 0.3s ease; }
        .btn-deconstruct:not(:disabled):hover .btn-icon { transform: rotate(15deg); }
        .btn-deconstruct.processing .btn-icon { animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            display: flex; align-items: flex-start; gap: 8px; padding: 10px 16px;
            border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 500;
            transition: var(--transition); flex: 1 1 auto; min-width: 0; max-width: 60%;
            animation: toastIn 0.3s ease; word-break: break-word;
        }
        .toast .toast-icon { font-size: 1rem; flex-shrink: 0; margin-top: 2px; }
        .toast .toast-msg {
            flex: 1; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-6px); scale: 0.96; } to { opacity: 1; transform: translateY(0); scale: 1; } }
        .toast.success { background: var(--success-bg); color: #15803d; border: 1px solid #bbf7d0; }
        .toast.error { background: var(--error-bg); color: #b91c1c; border: 1px solid #fecaca; }
        .toast.idle { background: #f8f9fb; color: #8894a0; border: 1px solid #e8ecf1; }

        .panel-right { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
        .preview-section { flex: 1.4; display: flex; flex-direction: column; padding: 20px 22px 12px; gap: 10px; min-height: 0; }
        .preview-container {
            flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius);
            overflow: hidden; background: #fff; position: relative; display: flex;
            align-items: center; justify-content: center; box-shadow: var(--shadow-sm); min-height: 200px;
        }
        .preview-container iframe {
            border: none; display: block; position: absolute; left: 50%; top: 50%;
            transform-origin: center center; transform: translate(-50%,-50%);
        }
        .preview-container iframe[hidden], .capture-preview[hidden] { display: none; }
        .capture-preview {
            position: absolute; inset: 0; overflow: auto; background: #fff;
            align-content: start; scrollbar-gutter: stable;
        }
        .capture-preview img { display: block; width: 100%; height: auto; }
        .preview-placeholder {
            position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; color: #c0c7cf; font-size: 0.9rem;
            pointer-events: none; z-index: 1; padding: 20px;
        }
        .preview-container.has-content .preview-placeholder { display: none; }

        .output-str-section { flex: 1; display: flex; flex-direction: column; padding: 8px 22px 20px; gap: 10px; min-height: 0; }
        .output-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .btn-copy, .btn-download, .btn-code-view {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
            border: 1.5px solid var(--border); background: var(--surface); border-radius: var(--radius-sm);
            font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); cursor: pointer;
            transition: var(--transition); white-space: nowrap; margin-left: 12px;
        }
        .btn-copy:hover:not(:disabled), .btn-download:hover:not(:disabled), .btn-code-view:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-copy.copied { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-copy:disabled, .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-code-view[hidden] { display: none; }

        .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.75rem; color: var(--text-secondary); flex-shrink: 0; padding: 2px 0; }
        .stat-item { display: flex; align-items: center; gap: 5px; background: #f8f9fb; padding: 4px 10px; border-radius: 20px; border: 1px solid #eef1f5; }
        .stat-value { font-weight: 600; color: var(--text); }

        .viewport-controls { display: flex; gap: 12px; align-items: center; margin-left: auto; }
        .viewport-input {
            width: 70px; padding: 4px 8px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-family: var(--font-mono); font-size: 0.85rem; text-align: center; background: var(--surface);
            color: var(--text); outline: none; transition: var(--transition);
        }
        .viewport-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,0.08); }
        .viewport-sep { color: var(--text-secondary); font-weight: 600; font-size: 0.9rem; user-select: none; }

        .sync-save-row {
            display: flex; align-items: center; gap: 12px; padding: 4px 0;
        }
        .sync-save-row .btn-select-file {
            padding: 6px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface); font-size: 0.85rem; font-weight: 500; cursor: pointer;
            color: var(--text-secondary); transition: var(--transition);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .sync-save-row .btn-select-file:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        .sync-save-path {
            font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 250px;
        }
        @media (max-width: 900px) {
            .main-content { flex-direction: column; }
            .panel-left { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--border); max-height: 50%; }
            .panel-right { max-height: 50%; }
            .app-container { max-height: none; min-height: 90vh; }
            textarea.input-area { min-height: 150px; }
            .output-code-wrapper { min-height: 120px; }
            .preview-container { min-height: 180px; }
            .toast { max-width: 100%; }
        }
        @media (max-width: 500px) {
            body { padding: 8px; }
            .app-header { padding: 12px 16px; }
            .panel-section { padding: 12px 14px; gap: 6px; }
            .preview-section { padding: 12px 14px 8px; }
            .output-str-section { padding: 6px 14px 12px; }
            .btn-deconstruct { padding: 10px 18px; font-size: 0.85rem; }
            .url-loader { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <div class="logo-icon">&#10233;</div>
        <h1>HTML 解构工具</h1>
        <span class="subtitle">data-u-name · 语义命名</span>
        <span class="version-tag">v3.10.0</span>
    </header>

    <div class="main-content">
        <div class="panel-left">
            <div class="panel-section">
                <div class="section-label"><span class="dot dot-input"></span> 输入的 HTML 字符串</div>
                <div class="url-loader">
                    <input type="text" id="urlInput" class="url-input" placeholder="网络 URL">
                    <input type="text" id="proxyInput" class="proxy-input" placeholder="本地代理（默认 127.0.0.1:8888）">
                    <button id="btnLoadUrl" class="btn-load">🌐 加载 URL</button>
                    <label class="btn-file">
                        📁 选择本地文件
                        <input type="file" id="fileInput" accept=".html,.htm,.css,.js" multiple>
                    </label>
                </div>
                <textarea id="inputHtml" class="input-area" placeholder="在此粘贴 HTML 字符串..."></textarea>
                <div class="action-row">
                    <button id="btnDeconstruct" class="btn-deconstruct"><span class="btn-icon">⚙</span> 开始解构</button>
                    <div id="toast" class="toast idle">
                        <span class="toast-icon">ℹ</span>
                        <span class="toast-msg">等待输入...</span>
                    </div>
                </div>
                <div class="stats-bar">
                    <span class="stat-item">元素数: <span class="stat-value" id="statElements">-</span></span>
                    <span class="stat-item">data-u-name: <span class="stat-value" id="statNamed">-</span></span>
                    <span class="stat-item">内联资源: <span class="stat-value" id="statInline">-</span></span>
                </div>
            </div>
        </div>

        <div class="panel-right">
            <div class="preview-section">
                <div class="section-label" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="dot dot-preview"></span> 输出的 HTML 页面（展示）
                    </div>
                    <div class="viewport-controls">
                        <input type="number" id="previewWidth" class="viewport-input" value="1920" min="1" step="1" title="视口宽度 (px)">
                        <span class="viewport-sep">×</span>
                        <input type="number" id="previewHeight" class="viewport-input" value="1080" min="1" step="1" title="视口高度 (px)">
                    </div>
                </div>
                <div class="preview-container" id="previewContainer">
                    <div class="preview-placeholder" id="previewPlaceholder">🔍 解构后的页面将在此展示</div>
                    <iframe id="previewFrame" title="HTML预览" loading="lazy" hidden></iframe>
                    <div id="capturePreview" class="capture-preview" role="img" aria-label="浏览器采集的静态页面预览" hidden></div>
                </div>
            </div>
            <div class="output-str-section">
                <div class="output-header">
                    <div class="section-label"><span class="dot dot-output"></span> 输出的 HTML 字符串（格式化）</div>
                    <div style="display: flex; gap: 8px;">
                        <button id="btnToggleFullCode" class="btn-code-view" hidden aria-pressed="false" title="仅切换代码区展示；复制和下载始终使用完整 HTML">查看完整代码</button>
                        <button id="btnCopy" class="btn-copy" disabled title="复制带属性的原始 HTML">📋 复制</button>
                        <button id="btnDownload" class="btn-download" disabled title="下载 HTML 文件">📥 下载</button>
                    </div>
                </div>
                <div class="output-code-wrapper" id="outputCodeWrapper">
                    <pre><code id="outputHtmlDisplay"></code></pre>
                </div>
                <div class="sync-save-row">
                    <button id="btnSelectFile" class="btn-select-file" title="选择要覆盖的本地 HTML 文件">💾 选择同步文件</button>
                    <span id="selectedFilePath" class="sync-save-path">未选择</span>
                </div>
                <textarea id="outputHtmlRaw" class="hidden-textarea" aria-hidden="true"></textarea>
            </div>
            <input type="file" id="syncFileInput" accept=".html,.htm" style="display: none;">
        </div>
    </div>
</div>

<script type="text/template" id="exampleHtml">
	  <!DOCTYPE html>
	  <html lang="zh-CN">
		<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>用户登录</title>
		<style>
			* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			}
		
			body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			}
		
			.login-card {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
			padding: 40px 35px;
			width: 100%;
			max-width: 400px;
			}
		
			.login-card h2 {
			text-align: center;
			margin-bottom: 30px;
			color: #333;
			font-size: 28px;
			font-weight: 500;
			}
		
			.input-group {
			margin-bottom: 20px;
			}
		
			.input-group label {
			display: block;
			margin-bottom: 8px;
			color: #555;
			font-size: 14px;
			font-weight: 500;
			}
		
			.input-group input {
			width: 100%;
			padding: 14px 16px;
			border: 2px solid #e0e0e0;
			border-radius: 10px;
			font-size: 15px;
			transition: border-color 0.3s;
			outline: none;
			}
		
			.input-group input:focus {
			border-color: #667eea;
			}
		
			.remember-group {
			display: flex;
			align-items: center;
			margin-bottom: 25px;
			font-size: 14px;
			color: #555;
			}
		
			.remember-group input[type="checkbox"] {
			margin-right: 8px;
			width: 16px;
			height: 16px;
			accent-color: #667eea;
			}
		
			.login-btn {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border: none;
			border-radius: 10px;
			color: white;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: opacity 0.3s;
			}
		
			.login-btn:hover {
			opacity: 0.9;
			}
		
			.extra-links {
			text-align: center;
			margin-top: 20px;
			font-size: 14px;
			color: #777;
			}
		
			.extra-links a {
			color: #667eea;
			text-decoration: none;
			margin: 0 5px;
			}
		
			.extra-links a:hover {
			text-decoration: underline;
			}
		</style>
		</head>
		<body>
		<div class="login-card">
			<h2>欢迎回来</h2>
			<form action="#" method="post">
			<div class="input-group">
				<label for="username">用户名</label>
				<input type="text" id="username" name="username" placeholder="请输入用户名" required>
			</div>
			<div class="input-group">
				<label for="password">密码</label>
				<input type="password" id="password" name="password" placeholder="请输入密码" required>
			</div>
			<div class="remember-group">
				<input type="checkbox" id="remember" name="remember">
				<label for="remember">记住我</label>
			</div>
			<button type="submit" class="login-btn">登 录</button>
			</form>
			<div class="extra-links">
			<a href="#">忘记密码？</a>
			<span>|</span>
			<a href="#">注册新账号</a>
			</div>
		</div>
		</body>
	  </html>
</script>

<script>
    (() => {
        const exampleHtml = document.getElementById('exampleHtml')?.textContent || '';
        const el = id => document.getElementById(id);
        const inputHtmlEl = el('inputHtml');
        const outputHtmlDisplay = el('outputHtmlDisplay');
        const outputCodeWrapper = el('outputCodeWrapper');
        const outputHtmlRaw = el('outputHtmlRaw');
        const btnDeconstruct = el('btnDeconstruct');
        const btnToggleFullCode = el('btnToggleFullCode');
        const btnCopy = el('btnCopy');
        const btnDownload = el('btnDownload');
        const toastEl = el('toast');
        const toastIcon = toastEl.querySelector('.toast-icon');
        const toastMsg = toastEl.querySelector('.toast-msg');
        const previewContainer = el('previewContainer');
        const previewFrame = el('previewFrame');
        const capturePreview = el('capturePreview');
        const previewPlaceholder = el('previewPlaceholder');
        const statElements = el('statElements');
        const statNamed = el('statNamed');
        const statInline = el('statInline');
        const urlInput = el('urlInput');
        const proxyInput = el('proxyInput');
        const btnLoadUrl = el('btnLoadUrl');
        const fileInput = el('fileInput');
        const previewWidthInput = el('previewWidth');
        const previewHeightInput = el('previewHeight');
        const btnSelectFile = el('btnSelectFile');
        const selectedFilePath = el('selectedFilePath');
        const syncFileInput = el('syncFileInput');

        let userWidth = 1920, userHeight = 1080;
        let selectedFileHandle = null;
        let captureCache = null;
        // 巨型网页快照常含单行压缩 CSS；关闭 textarea 自动换行可避免载入时排版成数千行。
        const setInputHtml = html => {
            inputHtmlEl.wrap = html.length > 100_000 ? 'off' : 'soft';
            inputHtmlEl.value = html;
        };

        function setOutputButtonsEnabled(enabled) {
            btnCopy.disabled = !enabled;
            btnDownload.disabled = !enabled;
        }

        async function writeToFile(handle, content) {
            if (handle.createWritable) {
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
            } else if (handle._file) {
                const blob = new Blob([content], { type: 'text/html' });
                saveAs(blob, handle.name || 'deconstructed.html');
            } else {
                throw new Error('无法写入文件：句柄无效');
            }
        }

        function downloadFile(content, filename = 'deconstructed.html') {
            const blob = new Blob([content], { type: 'text/html' });
            saveAs(blob, filename);
        }

        async function selectSyncFile() {
            if (window.showOpenFilePicker) {
                try {
                    const [fileHandle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'HTML files',
                            accept: { 'text/html': ['.html', '.htm'] }
                        }],
                        multiple: false
                    });
                    selectedFileHandle = fileHandle;
                    selectedFilePath.textContent = fileHandle.name;
                    showToast('success', `已选择文件: ${fileHandle.name}`);
                } catch (err) {
                    if (err.name !== 'AbortError') showToast('error', '选择文件失败: ' + err.message);
                }
            } else {
                syncFileInput.click();
            }
        }

        syncFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            selectedFileHandle = { kind: 'file', name: file.name, _file: file };
            selectedFilePath.textContent = file.name;
            showToast('success', `已选择文件: ${file.name}`);
            syncFileInput.value = '';
        });

        async function saveToSelectedFile(content) {
            if (!selectedFileHandle) return;
            try {
                await writeToFile(selectedFileHandle, content);
                if (selectedFileHandle.createWritable) {
                    showToast('success', `已同步保存至: ${selectedFileHandle.name}`);
                } else {
                    showToast('success', `因浏览器限制，已触发下载: ${selectedFileHandle.name}`);
                }
            } catch (err) {
                showToast('error', '同步保存失败: ' + err.message);
            }
        }

        const toCamelCase = str => {
            if (!str || typeof str !== 'string') return str;
            if (/^[a-z][a-zA-Z0-9]*$/.test(str)) return str;
            const parts = str.split(/[-_]+/);
            if (parts.length === 1 && str === parts[0]) return /^[A-Z]/.test(str) ? str.charAt(0).toLowerCase() + str.slice(1) : str;
            let result = parts[0].toLowerCase();
            for (let i = 1; i < parts.length; i++) if (parts[i].length > 0) result += parts[i].charAt(0).toUpperCase() + parts[i].slice(1).toLowerCase();
            return result;
        };
        const tagPurposeMap = {
            div: 'container', span: 'span', p: 'paragraph',
            h1: 'heading', h2: 'heading', h3: 'heading', h4: 'heading', h5: 'heading', h6: 'heading',
            ul: 'list', ol: 'orderedList', li: 'listItem', a: 'link', img: 'image',
            table: 'table', thead: 'tableHead', tbody: 'tableBody', tfoot: 'tableFoot', tr: 'tableRow', th: 'tableHeader', td: 'tableCell',
            form: 'form', input: 'input', button: 'button', select: 'select', textarea: 'textarea', label: 'label',
            section: 'section', article: 'article', nav: 'navigation', header: 'header', footer: 'footer', main: 'main', aside: 'aside',
            figure: 'figure', figcaption: 'figcaption', blockquote: 'blockquote', pre: 'pre', code: 'code',
            em: 'emphasis', strong: 'strong', small: 'small', br: 'break', hr: 'horizontalRule',
        };
        const showToast = (type, msg) => {
            toastEl.className = 'toast ' + type;
            toastIcon.innerHTML = type==='success'?'✔':(type==='error'?'✖':'ℹ');
            toastMsg.textContent = msg; toastMsg.title = msg;
        };
        const updateStats = (total, namedCount, inline) => {
            statElements.textContent = total ?? '-'; statNamed.textContent = namedCount ?? '-'; statInline.textContent = inline ?? '-';
        };
        const resetStats = () => { statElements.textContent = statNamed.textContent = statInline.textContent = '-'; };

        // 代码区只是查看入口：大块内联代码默认折叠，完整结果仍保存在 outputHtmlRaw 中供复制、下载和同步。
        // 8192 字符阈值让普通示例保持原样，同时避免压缩 CSS 形成数百万像素宽的单行布局。
        const codePreviewBlockLimit = 8192;
        const formatHTML = (html, foldLargeBlocks, maxNodes = Infinity) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            let result = '';
            let foldedBlocks = 0;
            let renderedNodes = 0;
            let omittedNodes = false;
            const doctypeMatch = html.trim().match(/^<!DOCTYPE[^>]*>/i);
            if (doctypeMatch) result = doctypeMatch[0] + '\n';
            const voidEls = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
            function process(node, depth) {
                const indent = '  '.repeat(depth);
                if (renderedNodes >= maxNodes) {
                    if (!omittedNodes) result += indent + '<!-- 后续结构已折叠；复制和下载包含完整 HTML -->\n';
                    omittedNodes = true;
                    return;
                }
                if (node.nodeType === Node.ELEMENT_NODE) {
                    renderedNodes++;
                    const tag = node.tagName.toLowerCase();
                    const isVoid = voidEls.has(tag);
                    let openTag = '<' + tag;
                    for (const attr of node.attributes) openTag += ` ${attr.name}="${attr.value}"`;
                    if (isVoid) { result += indent + openTag + ' />\n'; return; }
                    if (tag !== 'script' && tag !== 'style' && node.childNodes.length === 1 && node.childNodes[0].nodeType === Node.TEXT_NODE) {
                        result += indent + openTag + '>' + node.childNodes[0].textContent + '</' + tag + '>\n'; return;
                    }
                    result += indent + openTag + '>\n';
                    if (tag === 'script' || tag === 'style') {
                        const content = node.textContent || '';
                        if (foldLargeBlocks && content.length > codePreviewBlockLimit) {
                            foldedBlocks++;
                            result += `${indent}  /* ${tag === 'style' ? 'CSS' : 'JavaScript'} 共 ${content.length} 字符，代码区已折叠；复制和下载保留全文 */\n`;
                        } else {
                            content.split('\n').forEach(line => result += indent + '  ' + line + '\n');
                        }
                    }
                    else { for (const child of node.childNodes) process(child, depth + 1); }
                    result += indent + '</' + tag + '>\n';
                } else if (node.nodeType === Node.TEXT_NODE) { const text = node.textContent.replace(/\n\s*/g, ' ').trim(); if (text) result += indent + text + '\n'; }
                else if (node.nodeType === Node.COMMENT_NODE) { result += indent + '<!--' + node.textContent + '-->\n'; }
            }
            for (const child of doc.childNodes) { if (child.nodeType !== Node.DOCUMENT_TYPE_NODE) process(child, 0); }
            return { text: result.trimEnd(), foldedBlocks, omittedNodes };
        };
        const highlightHTML = html => {
            const esc = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            return esc
                .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="hljs-comment">$1</span>')
                .replace(/(&lt;\/?)([\w-]+)([\s\S]*?)(\/?&gt;)/g, (m,open,tag,attrs,close) => {
                    const attrHL = attrs.replace(/([\w-]+)(=)(&quot;)(.*?)(&quot;)/g, '<span class="hljs-attr">$1</span>$2<span class="hljs-string">$3$4$5</span>');
                    return `<span class="hljs-tag">${open}</span><span class="hljs-tag-name">${tag}</span>${attrHL}<span class="hljs-tag">${close}</span>`;
                })
                .replace(/(&lt;style[\s\S]*?&gt;)([\s\S]*?)(&lt;\/style&gt;)/g, (m,o,css,cl)=>o+'<span class="hljs-css">'+css+'</span>'+cl)
                .replace(/(&lt;script[\s\S]*?&gt;)([\s\S]*?)(&lt;\/script&gt;)/g, (m,o,js,cl)=>o+'<span class="hljs-js">'+js+'</span>'+cl);
        };
        document.head.appendChild(Object.assign(document.createElement('style'),{textContent:`
            .hljs-tag{color:#e06c75}.hljs-tag-name{color:#61afef;font-weight:bold}
            .hljs-attr{color:#d19a66}.hljs-string{color:#98c379}
            .hljs-comment{color:#5c6370;font-style:italic}
            .hljs-css,.hljs-js{color:#abb2bf}
        `}));

        let showFullCode = false;
        let hasFoldedCode = false;
        const clearOutputCode = () => {
            outputHtmlRaw.value = '';
            outputHtmlDisplay.textContent = '';
            // 清空旧内容后再复位滚动；在插入大型代码后复位会同步触发整块代码的布局。
            outputCodeWrapper.scrollTop = outputCodeWrapper.scrollLeft = 0;
            showFullCode = hasFoldedCode = false;
            btnToggleFullCode.hidden = true;
            btnToggleFullCode.setAttribute('aria-pressed', 'false');
        };
        const renderOutputCode = () => {
            // 完整 HTML 始终从隐藏文本框读取；展开按钮仅影响可见代码，不改变预览和导出内容。
            const maxNodes = !showFullCode && outputHtmlRaw.value.length > 50_000 ? 120 : Infinity;
            const { text, foldedBlocks, omittedNodes } = formatHTML(outputHtmlRaw.value, !showFullCode, maxNodes);
            if (!showFullCode) hasFoldedCode = foldedBlocks > 0 || omittedNodes;
            outputHtmlDisplay.innerHTML = highlightHTML(text);
            btnToggleFullCode.hidden = !hasFoldedCode;
            btnToggleFullCode.textContent = showFullCode ? '收起长代码' : '查看完整代码';
            btnToggleFullCode.setAttribute('aria-pressed', String(showFullCode));
        };

        const localProxy = 'http://127.0.0.1:8888/';
        const defaultProxies = [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        ];
        const fetchText = async (url, timeout) => {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeout);
            try {
                const res = await fetch(url, { signal: ctrl.signal, mode: 'cors' });
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 100)}`);
                return await res.text();
            } finally { clearTimeout(timer); }
        };
        const getLocalProxyRoots = () => {
            const custom = proxyInput.value.trim();
            const roots = [];
            if (custom && !custom.includes('{url}')) {
                try {
                    const parsed = new URL(custom);
                    if (['localhost', '127.0.0.1', '[::1]'].includes(parsed.hostname)) roots.push(custom.endsWith('/') ? custom : custom + '/');
                } catch {}
            }
            if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) roots.push(location.origin + '/');
            roots.push(localProxy);
            return [...new Set(roots)];
        };
        // 资源读取按直接请求、自定义/本地代理、公共代理依次回退，并保留各段失败原因。
        const fetchWithTimeout = async (url, timeout = 8000) => {
            const custom = proxyInput.value.trim();
            const attempts = [];
            // 从本地服务打开工具时，远程 CSS 先经同源代理获取，避免每次先等待浏览器的 CORS 拒绝。
            if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
                for (const root of getLocalProxyRoots()) attempts.push({ name: '本地代理', url: root + encodeURIComponent(url) });
            }
            attempts.push({ name: '直接请求', url });
            if (custom) attempts.push({ name: '自定义代理', url: custom.includes('{url}') ? custom.replace('{url}', encodeURIComponent(url)) : custom + encodeURIComponent(url) });
            for (const root of getLocalProxyRoots()) attempts.push({ name: '本地代理', url: root + encodeURIComponent(url) });
            defaultProxies.forEach((proxy, index) => attempts.push({ name: `公共代理 ${index + 1}`, url: proxy(url) }));
            const errors = [];
            const seen = new Set();
            for (const attempt of attempts) {
                if (seen.has(attempt.url)) continue;
                seen.add(attempt.url);
                try { return await fetchText(attempt.url, timeout); }
                catch (error) { errors.push(`${attempt.name}: ${error.message}`); }
            }
            throw new Error(`请求失败。${errors.join('；')}`);
        };
        // 只有随仓库提供的本地服务具备 /capture；公共 CORS 代理只能转发原始 HTML。
        const fetchCapturedPage = async (input) => {
            const errors = [];
            for (const root of getLocalProxyRoots()) {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 65000);
                try {
                    const url = root + 'capture';
                    const options = input.url
                        ? { signal: ctrl.signal }
                        : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input), signal: ctrl.signal };
                    const endpoint = input.url ? url + '?' + new URLSearchParams(input) : url;
                    const response = await fetch(endpoint, options);
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${(await response.text()).slice(0, 160)}`);
                    const captured = await response.json();
                    if (!captured.annotatedHtml || !Array.isArray(captured.screenshots)) throw new Error('代理未返回页面结构和预览');
                    return captured;
                } catch (error) { errors.push(`${root}: ${error.message}`); }
                finally { clearTimeout(timer); }
            }
            throw new Error(errors.join('；'));
        };
        // 旧版本本地代理的兼容回退；新服务使用一次采集同时取得页面和坐标。
        const fetchRenderedHtml = async (url) => {
            const errors = [];
            for (const root of getLocalProxyRoots()) {
                const query = new URLSearchParams({ url, width: String(userWidth), height: String(userHeight) });
                try { return await fetchText(root + 'render?' + query, 45000); }
                catch (error) { errors.push(error.message); }
            }
            throw new Error(errors.join('；'));
        };
        const prepareRemoteHtml = (html, url) => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            // 远程脚本不能在工具的 srcdoc 来源安全且可靠地重放；动态内容由本地浏览器先行渲染。
            doc.querySelectorAll('script, link[rel="modulepreload"], link[rel="preload"][as="script"]').forEach(el => el.remove());
            let base = doc.head.querySelector('base[href]');
            if (!base) { base = doc.createElement('base'); doc.head.prepend(base); base.href = url; }
            const baseUrl = new URL(base.getAttribute('href'), url).href;
            // 输出会离开原网站，图片与样式表必须保留可解析的绝对地址。
            for (const [selector, attr] of [['img[src],source[src]', 'src'], ['link[href]', 'href'], ['video[poster]', 'poster']]) {
                doc.querySelectorAll(selector).forEach(el => {
                    const value = el.getAttribute(attr);
                    if (!value || /^(data:|blob:|javascript:|#)/i.test(value)) return;
                    try { el.setAttribute(attr, new URL(value, baseUrl).href); } catch {}
                });
            }
            return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        };
        // 动态网页优先走浏览器快照；静态回退会明确提示内容可能不完整。
        const loadFromUrl = async (url) => {
            let target;
            try { target = new URL(url); } catch { throw new Error('请输入完整的 HTTP 或 HTTPS URL'); }
            if (!['http:', 'https:'].includes(target.protocol)) throw new Error('仅支持 HTTP 或 HTTPS URL');
            const captureWidth = userWidth, captureHeight = userHeight;
            btnLoadUrl.disabled = true;
            btnDeconstruct.disabled = true;
            showToast('idle', '浏览器正在后台采集页面...');
            captureCache = null;
            try {
                try {
                    const result = await fetchCapturedPage({ url: target.href, width: captureWidth, height: captureHeight });
                    const pageUrl = result.pageUrl || target.href;
                    const input = prepareRemoteHtml(result.rawHtml, pageUrl);
                    setInputHtml(input);
                    captureCache = {
                        input, width: captureWidth, height: captureHeight,
                        result: { ...result, annotatedHtml: prepareRemoteHtml(result.annotatedHtml, pageUrl) }
                    };
                    showToast('success', '后台采集完成；点击“开始解构”展示预览和坐标');
                    return;
                } catch (captureError) {
                    // 旧版代理仍可读原始 DOM，但在当前本地服务中不悄悄退回会卡顿的 iframe 路径。
                    if (location.protocol !== 'file:') throw captureError;
                    let html, renderError;
                    try { html = await fetchRenderedHtml(target.href); }
                    catch (error) { renderError = error; }
                    if (!html) {
                        try { html = await fetchWithTimeout(target.href); }
                        catch (error) { throw new Error(`无法加载网页。浏览器采集：${captureError.message}；原始 HTML：${error.message}`); }
                        showToast('error', `仅加载了原始 HTML；动态内容可能缺失。${renderError?.message || ''}`);
                    } else showToast('error', '已使用旧版代理加载；建议更新本地服务以使用后台预览');
                    setInputHtml(prepareRemoteHtml(html, target.href));
                }
            } finally { btnLoadUrl.disabled = false; btnDeconstruct.disabled = false; }
        };

        const inlineLocalResources = (html, fileMap) => {
            let result = html;
            result = result.replace(/<link\s[^>]*?\/?>/gi, (tag) => {
                if (!/\brel\s*=\s*["']?stylesheet["']?/i.test(tag)) return tag;
                const hrefMatch = tag.match(/\bhref\s*=\s*["']([^"']+)["']/i) || tag.match(/\bhref\s*=\s*([^\s>]+)/i);
                if (!hrefMatch) return tag;
                const href = hrefMatch[1];
                if (/^(https?:)?\/\//i.test(href)) return tag;
                const basename = href.split('/').pop().split('?')[0];
                const content = fileMap.get(basename);
                if (content) return '<style>' + content + '<\/style>';
                return tag;
            });
            result = result.replace(/<script\b[^>]*>/gi, (tag) => {
                const srcMatch = tag.match(/\bsrc\s*=\s*["']([^"']+)["']/i) || tag.match(/\bsrc\s*=\s*([^\s>]+)/i);
                if (!srcMatch) return tag;
                const src = srcMatch[1];
                if (/^(https?:)?\/\//i.test(src)) return tag;
                const basename = src.split('/').pop().split('?')[0];
                const content = fileMap.get(basename);
                if (content) {
                    let remainingAttrs = tag.replace(/\bsrc\s*=\s*["'][^"']*["']\s*/i, '').replace(/\bsrc\s*=\s*[^\s>]+\s*/i, '');
                    remainingAttrs = remainingAttrs.replace(/^\s*<script\s*/i, '').replace(/\s*>\s*$/, '');
                    return '<script' + (remainingAttrs ? ' ' + remainingAttrs : '') + '>' + content;
                }
                return tag;
            });
            return result;
        };

        const loadLocalFiles = async (files) => {
            if (!files.length) return;
            showToast('idle', '正在读取本地文件...');
            const fileMap = new Map();
            let mainHtmlFile = null;
            const readTasks = [];
            for (const file of files) {
                const name = file.name;
                const ext = name.split('.').pop().toLowerCase();
                readTasks.push((async () => {
                    const text = await file.text();
                    if (ext === 'html' || ext === 'htm') { mainHtmlFile = { name, text }; fileMap.set(name, text); }
                    else { fileMap.set(name, text); }
                })());
            }
            await Promise.all(readTasks);
            if (!mainHtmlFile) { showToast('error', '未找到 HTML 文件，请至少选择一个 .html 文件'); return; }
            let html = mainHtmlFile.text;
            html = inlineLocalResources(html, fileMap);
            setInputHtml(html);
            captureCache = null;
            showToast('success', `已加载 ${mainHtmlFile.name}，并自动内联了 ${fileMap.size - 1} 个本地资源`);
        };

        const absolutizeCssUrls = (css, stylesheetUrl) => css.replace(/url\(\s*(?:"([^"]*)"|'([^']*)'|([^)]*))\s*\)/gi, (match, doubleQuoted, singleQuoted, unquoted) => {
            const value = (doubleQuoted ?? singleQuoted ?? unquoted).trim();
            if (!value || /^(data:|blob:|https?:|\/\/|#)/i.test(value)) return match;
            try { return `url("${new URL(value, stylesheetUrl).href}")`; }
            catch { return match; }
        });
        const collectExternalResources = async (doc, cache = new Map()) => {
            const links = [...doc.querySelectorAll('link[rel="stylesheet"][href]')]
                .filter(link => /^https?:$/.test(new URL(link.href).protocol));
            const seen = new Set(); let inlineCount = 0; const warnings = [];
            for (const link of links) {
                const href = link.getAttribute('href');
                if (!href || seen.has(href)) continue;
                seen.add(href);
                if (cache.has(href)) { inlineCount++; continue; }
                try {
                    const content = await fetchWithTimeout(link.href);
                    // 内联后 CSS 的 url(...) 将相对页面而非原样式表解析，先改成绝对地址。
                    cache.set(href, absolutizeCssUrls(content, link.href));
                    inlineCount++;
                }
                catch (e) { warnings.push(`CSS ${href}: ${e.message}`); }
            }
            return { inlineCount, warnings, cache };
        };

        const addDataUName = (doc) => {
            const body = doc.body;
            if (!body) return { total: 0, namedCount: 0 };
            const getBaseName = (el) => {
                if (el.id && el.id.trim()) return toCamelCase(el.id.trim());
                if (el.hasAttribute('class') && el.getAttribute('class').trim()) return toCamelCase(el.getAttribute('class').trim().split(/\s+/)[0]);
                const tag = el.tagName.toLowerCase(); return tagPurposeMap[tag] || tag;
            };
            const elements = [body, ...body.querySelectorAll('*')].filter(el => el.tagName !== 'STYLE' && el.tagName !== 'SCRIPT');
            for (const el of elements) {
                let base = getBaseName(el);
                const parent = el.parentElement;
                if (parent) {
                    const usedNames = new Set();
                    let sibling = el.previousElementSibling;
                    while (sibling) { if (sibling.hasAttribute('data-u-name')) usedNames.add(sibling.getAttribute('data-u-name')); sibling = sibling.previousElementSibling; }
                    if (usedNames.has(base)) { let suffix = 2; while (usedNames.has(base + suffix)) suffix++; base = base + suffix; }
                }
                el.setAttribute('data-u-name', base);
            }
            return { total: elements.length, namedCount: elements.length };
        };

        const applyIframeScale = () => {
            if (previewFrame.hidden || !previewFrame.contentDocument?.body) return;
            const containerW = previewContainer.clientWidth, containerH = previewContainer.clientHeight;
            if (containerW === 0 || containerH === 0 || userWidth <= 0 || userHeight <= 0) return;
            const scale = Math.min(containerW / userWidth, containerH / userHeight, 1);
            previewFrame.style.width = userWidth + 'px';
            previewFrame.style.height = userHeight + 'px';
            previewFrame.style.transform = `translate(-50%,-50%) scale(${scale})`;
        };

        const resetIframe = () => {
            // 空 iframe 再次赋值 srcdoc 会触发一次无意义的文档导航和布局。
            if (previewFrame.srcdoc) previewFrame.srcdoc = '';
            previewFrame.style = '';
            previewFrame.hidden = true;
            capturePreview.replaceChildren();
            capturePreview.hidden = true;
            previewContainer.classList.remove('has-content');
            previewPlaceholder.style.display = '';
        };

        const showCapturedPreview = async (screenshots) => {
            if (!screenshots.length) throw new Error('浏览器没有生成预览图');
            capturePreview.hidden = false;
            previewContainer.classList.add('has-content');
            for (const [index, tile] of screenshots.entries()) {
                const image = new Image();
                image.alt = `页面预览第 ${index + 1} 段`;
                image.decoding = 'async';
                image.src = 'data:image/png;base64,' + tile.data;
                await image.decode();
                capturePreview.append(image);
                showToast('idle', `正在显示页面预览（${index + 1}/${screenshots.length}）...`);
                // 每张图交给浏览器单独绘制，让用户在大型页面上看到逐段出现的结果。
                await new Promise(resolve => requestAnimationFrame(resolve));
            }
        };

        const applyViewportFromInputs = () => {
            let w = parseInt(previewWidthInput.value, 10), h = parseInt(previewHeightInput.value, 10);
            if (!isNaN(w) && w > 0) userWidth = w; else previewWidthInput.value = userWidth;
            if (!isNaN(h) && h > 0) userHeight = h; else previewHeightInput.value = userHeight;
            applyIframeScale();
        };
        previewWidthInput.addEventListener('change', applyViewportFromInputs);
        previewHeightInput.addEventListener('change', applyViewportFromInputs);
        previewWidthInput.addEventListener('input', applyViewportFromInputs);
        previewHeightInput.addEventListener('input', applyViewportFromInputs);
        window.addEventListener('resize', () => { if (previewContainer.classList.contains('has-content')) applyIframeScale(); });

        const decodeHTMLEntities = (str) => { const txt = document.createElement('textarea'); txt.innerHTML = str; return txt.value; };

        const inlineResourcesInHtml = (html, cache) => {
            let result = html;
            result = result.replace(/<link\s[^>]*?\/?>/gi, (tag) => {
                const hasRel = /\brel\s*=\s*["']?stylesheet["']?/i.test(tag);
                if (!hasRel) return tag;
                const hrefMatch = tag.match(/\bhref\s*=\s*["']([^"']+)["']/i) || tag.match(/\bhref\s*=\s*([^\s>]+)/i);
                if (!hrefMatch) return tag;
                const href = decodeHTMLEntities(hrefMatch[1]);
                const content = cache.get(href);
                if (content) return '<style>' + content + '<\/style>';
                return tag;
            });
            return result;
        };

        const handleDeconstruct = async () => {
            const input = inputHtmlEl.value;
            let validationDoc;
            try {
                validationDoc = new DOMParser().parseFromString(input, 'text/html');
                if (validationDoc.querySelectorAll('parsererror').length) throw new Error('HTML 解析错误');
            } catch (e) { showToast('error', '❌ 输入非法：' + e.message); return; }

            resetStats(); resetIframe(); clearOutputCode(); setOutputButtonsEnabled(false);
            btnDeconstruct.disabled = true; btnDeconstruct.classList.add('processing');
            btnDeconstruct.querySelector('.btn-icon').textContent = '⏳';
            showToast('idle', '正在加载页面...');

            try {
                let result;
                try {
                    const cached = captureCache && captureCache.input === input && captureCache.width === userWidth && captureCache.height === userHeight;
                    result = cached ? captureCache.result
                        : await fetchCapturedPage({ html: input, width: userWidth, height: userHeight });
                } catch (error) {
                    if (location.protocol !== 'file:') throw error;
                    showToast('error', `本地采集不可用，使用浏览器内预览：${error.message}`);
                }
                if (result) {
                    const annotatedDoc = new DOMParser().parseFromString(result.annotatedHtml, 'text/html');
                    // 预览与远程 CSS 读取并行；代理中的 Chrome 已完成页面布局，工具页只处理静态结果。
                    const resources = collectExternalResources(annotatedDoc);
                    await showCapturedPreview(result.screenshots);
                    const { inlineCount, warnings, cache } = await resources;
                    const finalHtml = inlineResourcesInHtml(result.annotatedHtml, cache);
                    updateStats(result.total, result.namedCount, inlineCount);
                    outputHtmlRaw.value = finalHtml;
                    await new Promise(resolve => requestAnimationFrame(resolve));
                    renderOutputCode();
                    setOutputButtonsEnabled(true);
                    if (selectedFileHandle) await saveToSelectedFile(finalHtml);
                    if (warnings.length || result.previewTruncated) {
                        showToast('error', `解构完成；${warnings.length ? `CSS 内联警告：${warnings.join('；')}` : ''}${result.previewTruncated ? '预览图因页面过长已截断，坐标和 HTML 完整。' : ''}`);
                    } else showToast('success', `✅ 完成！${result.total} 元素，${result.namedCount} 个 data-u-name`);
                    return;
                }
                previewFrame.hidden = false;
                previewFrame.srcdoc = input;
                // 静态页面的样式请求与 iframe 加载并行；含脚本页面仍在加载后扫描，保留动态添加的样式表。
                const resourceTask = validationDoc.querySelector('script') ? null
                    : collectExternalResources(validationDoc).then(value => ({ value }), error => ({ error }));

                await new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        showToast('error', '❌ ' + 'iframe 加载超时（15秒）');
                        console.error('iframe 加载超时（15秒）');
                        resolve();
                    }, 15000);
                    previewFrame.onload = () => {
                        clearTimeout(timeout);
                        const doc = previewFrame.contentDocument;
                        if (!doc || !doc.body) {
                            showToast('error', '❌ 无法访问 iframe 内容（可能由于跨域限制）');
                            console.error('无法访问 iframe 内容（可能由于跨域限制）');
                            resolve();
                            return;
                        }
                        resolve();
                    };
                    previewFrame.onerror = () => {
                        clearTimeout(timeout);
                        showToast('error', '❌ iframe 加载失败');
                        console.error('iframe 加载失败');
                        resolve();
                    };
                });

                const doc = previewFrame.contentDocument;
                if (!doc || !doc.body) throw new Error('无法访问 iframe 内容');

                const prefetched = resourceTask ? await resourceTask : null;
                if (prefetched?.error) throw prefetched.error;
                // 再扫一次实际页面，补上内联事件等途径在 iframe 中新增的样式表。
                const { inlineCount, warnings, cache } = await collectExternalResources(doc, prefetched?.value.cache);
                const { total, namedCount } = addDataUName(doc);
                updateStats(total, namedCount, inlineCount);
                if (warnings.length) showToast('error', `内联警告：${warnings.join('；')}`);
                else showToast('success', '正在计算位置...');

                applyIframeScale();
                await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));

                const body = doc.body;
                const iframeBodyRect = body.getBoundingClientRect();
                const els = [body, ...body.querySelectorAll('*')].filter(el => el.tagName !== 'STYLE' && el.tagName !== 'SCRIPT');
                for (const el of els) {
                    try {
                        const r = el.getBoundingClientRect();
                        el.setAttribute('data-u-left', Math.round(r.left - iframeBodyRect.left));
                        el.setAttribute('data-u-top', Math.round(r.top - iframeBodyRect.top));
                        el.setAttribute('data-u-width', Math.round(r.width));
                        el.setAttribute('data-u-height', Math.round(r.height));
                    } catch { el.setAttribute('data-u-left',0); el.setAttribute('data-u-top',0); el.setAttribute('data-u-width',0); el.setAttribute('data-u-height',0); }
                }

                previewContainer.classList.add('has-content');
                previewPlaceholder.style.display = 'none';

                const serializer = new XMLSerializer();
                let finalHtml = serializer.serializeToString(doc);
                finalHtml = inlineResourcesInHtml(finalHtml, cache);

                outputHtmlRaw.value = finalHtml;
                renderOutputCode();

                setOutputButtonsEnabled(true);

                if (selectedFileHandle) await saveToSelectedFile(finalHtml);

                showToast('success', `✅ 完成！${total} 元素，${namedCount} 个 data-u-name`);
            } catch (err) {
                resetIframe(); resetStats(); clearOutputCode(); setOutputButtonsEnabled(false);
                showToast('error', '❌ ' + err.message); console.error(err);
            } finally {
                btnDeconstruct.disabled = false; btnDeconstruct.classList.remove('processing');
                btnDeconstruct.querySelector('.btn-icon').textContent = '⚙';
            }
        };

        btnDeconstruct.addEventListener('click', handleDeconstruct);
        btnToggleFullCode.addEventListener('click', () => {
            if (!hasFoldedCode) return;
            showFullCode = !showFullCode;
            renderOutputCode();
        });

        btnCopy.addEventListener('click', async () => {
            const text = outputHtmlRaw.value;
            if (!text) return;
            try { await navigator.clipboard.writeText(text); btnCopy.classList.add('copied'); btnCopy.textContent = '✔ 已复制'; setTimeout(() => { btnCopy.classList.remove('copied'); btnCopy.textContent = '📋 复制'; }, 2000); }
            catch { showToast('error', '复制失败'); }
        });

        btnDownload.addEventListener('click', () => {
            const text = outputHtmlRaw.value;
            if (!text) return;
            downloadFile(text);
        });

        btnSelectFile.addEventListener('click', selectSyncFile);

        inputHtmlEl.addEventListener('keydown', e => {
            if ((e.ctrlKey||e.metaKey) && e.key==='Enter') { e.preventDefault(); if(!btnDeconstruct.disabled) handleDeconstruct(); }
        });
        inputHtmlEl.addEventListener('input', () => { inputHtmlEl.wrap = inputHtmlEl.value.length > 100_000 ? 'off' : 'soft'; });
        btnLoadUrl.addEventListener('click', () => loadFromUrl(urlInput.value.trim()).catch(e => showToast('error', e.message)));
        fileInput.addEventListener('change', (e) => loadLocalFiles(e.target.files));

        if (exampleHtml) setInputHtml(exampleHtml);
    })();
</script>
</body>
</html>
